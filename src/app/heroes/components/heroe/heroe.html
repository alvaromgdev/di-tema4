<h1>Goku</h1>

<dl>
  <dt>Nombre:</dt>
  <dd>{{nombre}}</dd>

  <dt>Edad:</dt>
  <dd>{{edad}}</dd>

  <dt>Nombre capitalizado:</dt>
  <dd>{{nombreCapitalizado}}</dd>

  <dt>Descripción:</dt>
  <dd>{{getDescripcionHeroe()}}</dd>
</dl>

@if (nombre === 'Goku') {
  <button class="btn btn-primary" (click)="cambiarNombre()">
    Cambiar nombre
  </button>
}

@if (nombre === 'Goku') {
  <button class="btn btn-primary" (click)="cambiarEdad()">
    Cambiar edad
  </button>
}
