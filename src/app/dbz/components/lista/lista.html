<h4 class="mb-3">Listado</h4>

<ul class="list-group">

  @for (personaje of personajes; track personaje.nombre) {
    <li class="list-group-item d-flex justify-content-between align-items-center">

      <strong>{{ personaje.nombre }}</strong>

      <span>Fuerza: {{ personaje.fuerza }}</span>

    </li>
  } @empty {
    <li class="list-group-item text-muted">
      No hay personajes
    </li>
  }

</ul>
